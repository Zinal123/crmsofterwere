; Employee ID document upload allows up to 10MB
; (app/Http/Controllers/Workforce/EmployeeController.php validationRules(),
; 'document' => '...|max:10240'). Server defaults on shared hosting are
; often lower (e.g. upload_max_filesize=2M), which silently rejects any
; real-world phone-camera photo of an ID document well under the app's
; own stated limit. post_max_size must exceed upload_max_filesize to leave
; room for the rest of the multipart form fields.
;
; .user.ini is picked up automatically by PHP-FPM/CGI (most modern shared
; hosting, including Hostinger) without needing hPanel access - unlike
; .htaccess php_value directives, which only work under mod_php.
upload_max_filesize = 12M
post_max_size = 15M
