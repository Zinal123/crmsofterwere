name: CI/CD — test and deploy

# Tests run on every push and PR touching meet-update, so a PR gets the same
# gate before it's even merged. Deploy only runs on a direct push to
# meet-update (never on a PR), and only after the test job succeeds.
on:
  push:
    branches: [meet-update]
  pull_request:
    branches: [meet-update]
  # Lets you fire the whole pipeline by hand from the Actions tab (Run
  # workflow) - useful for the first end-to-end test before trusting it to
  # run unattended on every push.
  workflow_dispatch:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_sqlite, sqlite3, fileinfo, gd, curl, zip
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy testing environment
        # .env.testing is committed to the repo (sqlite in-memory, array
        # drivers, a real APP_KEY) - this is the exact env local `php
        # artisan test` runs use too, so CI matches local behavior.
        run: cp .env.testing .env

      - name: Run test suite
        run: php artisan test

      - name: Show Laravel log on failure
        # Widespread 500s in CI that don't reproduce locally are almost
        # always a real exception the test assertions never print (they
        # only see "expected 200 got 500", not why) - this surfaces the
        # actual stack trace so we don't have to guess from screenshots.
        if: failure()
        run: |
          echo "--- storage/logs/laravel.log (last 200 lines) ---"
          tail -n 200 storage/logs/laravel.log 2>/dev/null || echo "(no log file found)"

  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    # A push to meet-update deploys automatically; a manual "Run workflow"
    # click also deploys (e.g. to re-run a deploy with no new commit). A
    # pull_request event never deploys, even one opened against meet-update.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/meet-update'
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            # Hostinger's bare `php`/`composer` resolve to PHP 8.1 (CloudLinux's
            # selector at /etc/cl.selector/php-cli is hardwired to 8.1
            # regardless of directory), but this app's locked dependencies
            # need 8.2+ and the site itself is configured for 8.3 in hPanel.
            # Call the real 8.3 binary explicitly everywhere instead of
            # relying on PATH.
            PHP=/opt/alt/php83/usr/bin/php
            COMPOSER=/usr/local/bin/composer

            # If any step below fails, this guarantees maintenance mode gets
            # turned back off before the script exits - a failed deploy
            # should never leave the live site stuck on a 503 page.
            trap '$PHP artisan up || true' EXIT

            $PHP artisan down --render="errors::503" || true

            git fetch origin meet-update
            git reset --hard origin/meet-update

            $PHP $COMPOSER install --no-dev --optimize-autoloader --no-interaction

            $PHP artisan migrate --force
            $PHP artisan db:seed --class=RolesAndPermissionsSeeder --force

            $PHP artisan storage:link || true

            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache

            $PHP artisan up
